[pytest]
# importlib mode: the 3 agents each ship a `tests/` package and a `<pkg>.serve`
# module — path-derived module names avoid any cross-agent import collision.
addopts = --import-mode=importlib
pythonpath = agents/hotel_search_agent agents/faq_agent agents/b2c_concierge libs/b2c_common
testpaths = agents libs
