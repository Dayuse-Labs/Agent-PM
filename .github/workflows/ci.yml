# CI AgentB2C (S3). GitHub Actions — le repo vit sur GitHub Dayuse-Labs (décision S1),
# le plan GitLab de la phase est transposé à jobs identiques.
#
# Secrets requis :
# - FLEET_READ_TOKEN : PAT fine-grained en LECTURE sur Dayuse-Labs/dayuse-agent-fleet
#   (dayuse-agent-common est une dépendance git pinnée vers ce repo privé).
# - OPENAI_API_KEY + MCP_B2C_URL + MCP_B2C_AUTH_TOKEN + MAPBOX_ACCESS_TOKEN
#   (optionnels) : nécessaires aux évaluations live. Sans eux, statut explicite
#   « non exécuté » dans le résumé ; un job ignoré n'est pas une mesure de qualité.
# - LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_BASE_URL (optionnels) : activent le job
#   langfuse-experiments (OBS6) ; sans eux, le job est sauté.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Autoriser pip à résoudre la dépendance fleet (repo privé)
        run: |
          git config --global url."https://x-access-token:${{ secrets.FLEET_READ_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Install
        run: |
          pip install -r agents/hotel_search_agent/requirements.txt \
                      -r agents/faq_agent/requirements.txt \
                      -r agents/b2c_concierge/requirements.txt \
                      -r requirements-dev.txt \
                      -e libs/b2c_common
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy agents libs
      - name: Tests (pytest — offline, ni réseau ni clé API)
        run: pytest -q
      - name: Guardrails statiques Dayuse (zéro lock-in)
        run: bash scripts/dayuse_guardrails.sh .

  # Batterie existante S08 : mêmes 32 scénarios canoniques, judge LiteLLM.
  # L'ancien extra google-adk[eval] impose un litellm incompatible avec le runtime.
  # Rapport exploratoire non bloquant ; ni succès du job ni score judge ne vaut GO.
  eval:
    runs-on: ubuntu-latest
    needs: checks
    continue-on-error: true
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MCP_B2C_URL: ${{ secrets.MCP_B2C_URL }}
      MCP_B2C_AUTH_TOKEN: ${{ secrets.MCP_B2C_AUTH_TOKEN }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      # The baselines.json setup = the demo's mix: leaves and judge on the code
      # default (openai/gpt-6-luna), synthesis gpt-5.2, triage gpt-4o-mini until
      # its switch (reports/TRIAGE-GPT6-AB-2026-10.md; shutdown 2027-01-14).
      DAYUSE_MODEL_TRIAGE: gpt-4o-mini
      DAYUSE_MODEL_SYNTHESIS: gpt-5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la configuration live sans afficher de secret
        id: gate
        run: |
          missing=()
          for key in OPENAI_API_KEY MCP_B2C_URL MCP_B2C_AUTH_TOKEN MAPBOX_ACCESS_TOKEN; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Batterie live non exécutée : configuration absente (${missing[*]})."
            echo "### Batterie live : non exécutée" >> "$GITHUB_STEP_SUMMARY"
            echo "Configuration absente : ${missing[*]}. Aucun scénario ni score qualité produit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Autoriser pip à résoudre la dépendance fleet (repo privé)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.FLEET_READ_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r agents/hotel_search_agent/requirements.txt \
                      -r agents/faq_agent/requirements.txt \
                      -r agents/b2c_concierge/requirements.txt \
                      -r requirements-dev.txt \
                      -e libs/b2c_common
      - name: Boot des services + batterie de 32 scénarios (rapport exploratoire)
        if: steps.gate.outputs.run == 'true'
        run: |
          trap 'bash scripts/run_local.sh stop' EXIT
          bash scripts/run_local.sh
          python scripts/run_dynamic_conversation_regression.py --output evals/reports/ci-battery.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path("evals/reports/ci-battery.json").read_text())["summary"]
          if summary["total"] != 32:
              raise SystemExit("Batterie incomplète : 32 scénarios attendus")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("### Batterie live exécutée — pas de validation de lancement\n")
              report.write(f"Judge : {summary['passed']}/32 scénarios satisfaits. ")
              report.write("Le budget du runner compte des phases logiques, pas les appels LLM réels.\n")
          PY

  # OBS6 — datasets + experiments Langfuse (evals/langfuse_experiment.py, D-OBS-3 :
  # évaluateurs Python déterministes, zéro judge LLM ici). NON BLOQUANT ce tour-ci : on pose
  # la mesure avant le seuil (evals/tests/test_langfuse_experiment_gate.py documente comment
  # le fixer une fois 2-3 runs de référence observés sur main — cf. HANDOFF.md, bloc OBS6).
  langfuse-experiments:
    runs-on: ubuntu-latest
    needs: checks
    continue-on-error: true
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      MCP_B2C_URL: ${{ secrets.MCP_B2C_URL }}
      MCP_B2C_AUTH_TOKEN: ${{ secrets.MCP_B2C_AUTH_TOKEN }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      RUN_LANGFUSE_EXPERIMENT_GATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les prérequis live et Langfuse
        id: gate
        run: |
          missing=()
          for key in OPENAI_API_KEY LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY LANGFUSE_BASE_URL MCP_B2C_URL MCP_B2C_AUTH_TOKEN MAPBOX_ACCESS_TOKEN; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Experiment Langfuse non exécuté : configuration absente (${missing[*]})."
            echo "### Langfuse : non exécuté" >> "$GITHUB_STEP_SUMMARY"
            echo "Configuration absente : ${missing[*]}. Aucun experiment validé." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Autoriser pip à résoudre la dépendance fleet (repo privé)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.FLEET_READ_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r agents/hotel_search_agent/requirements.txt \
                      -r agents/faq_agent/requirements.txt \
                      -r agents/b2c_concierge/requirements.txt \
                      -r requirements-dev.txt \
                      -e libs/b2c_common
      # Les datasets hébergés peuvent contenir des corrections humaines.
      # Ne pas réimporter les fichiers locaux ici : l'upsert remplace les items
      # de même ID. Le test lit le dataset existant et échoue s'il est absent.
      - name: Boot des 3 services + experiment sur b2c/geo-poi
        if: steps.gate.outputs.run == 'true'
        run: |
          trap 'bash scripts/run_local.sh stop' EXIT
          bash scripts/run_local.sh
          pytest -q evals/tests/test_langfuse_experiment_gate.py
