# Typecheck config (S3) — pragmatic level for the skeleton: catch real type
# defects in OUR code without fighting untyped third-party surfaces. Tighten
# deliberately (per-module strictness) as the codebase hardens.
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
explicit_package_bases = True
mypy_path = agents/hotel_search_agent:agents/faq_agent:agents/b2c_concierge:libs/b2c_common
# tests excluded: the three agents each have a `tests` package (same module name —
# fine for pytest's importlib mode, unresolvable for mypy) and tests monkeypatch
# freely; the typecheck gate covers the shipped source.
exclude = (?x)(^\.venv|^baseline/|/tests/)
