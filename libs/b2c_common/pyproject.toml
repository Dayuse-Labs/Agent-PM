[project]
name = "b2c-common"
version = "0.1.0"
description = "AgentB2C shared foundations: interim D7 identity (static bearer, fail-closed)."
requires-python = ">=3.12"
dependencies = [
  "starlette",  # provided transitively by google-adk[a2a]; declared for standalone installs
  "pydantic>=2",  # geo_intent.py (GeoIntent); provided transitively by google-adk
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["b2c_common"]
